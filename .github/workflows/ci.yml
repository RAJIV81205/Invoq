name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — Compile Soroban contracts to WASM
  # ─────────────────────────────────────────────────────────────────────────
  contracts:
    name: Contracts — compile to WASM
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build release WASM artifacts
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Verify WASM artifacts
        run: |
          echo "Compiled contracts:"
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -f "$wasm" ] && echo "  ✓ $(basename $wasm) — $(wc -c < $wasm) bytes"
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — Frontend: type check, lint, build
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build Next.js app
        run: npm run build
