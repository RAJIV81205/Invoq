name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — TypeScript type check
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript — type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npm run typecheck

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — ESLint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint — lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Next.js build
  # ─────────────────────────────────────────────────────────────────────────
  build-next:
    name: Next.js — build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Compile Soroban contracts to WASM
  # ─────────────────────────────────────────────────────────────────────────
  contracts-compile:
    name: Contracts — compile to WASM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Stellar CLI
        run: |
          # Download pre-built binary instead of compiling from source (~10s vs ~10min)
          STELLAR_VERSION="26.0.0"
          curl -sSL "https://github.com/stellar/stellar-cli/releases/download/v${STELLAR_VERSION}/stellar-cli-${STELLAR_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C /usr/local/bin stellar
          stellar --version

      - name: Compile contracts
        run: stellar contract build

      - name: Verify WASM artifacts
        run: |
          echo "Compiled contracts:"
          for wasm in target/wasm32-unknown-unknown/release/*.wasm; do
            [ -f "$wasm" ] && echo "  ✓ $(basename $wasm) — $(wc -c < $wasm) bytes"
          done
          # stellar contract build may also output to wasm32v1-none on newer toolchains
          for wasm in target/wasm32v1-none/release/*.wasm; do
            [ -f "$wasm" ] && echo "  ✓ $(basename $wasm) — $(wc -c < $wasm) bytes"
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts-${{ github.sha }}
          path: |
            target/wasm32-unknown-unknown/release/*.wasm
            target/wasm32v1-none/release/*.wasm
          retention-days: 30
