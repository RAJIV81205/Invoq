name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # JOB 1 — TypeScript type check
  # ─────────────────────────────────────────────────────────────────────────
  typecheck:
    name: TypeScript — type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 2 — ESLint
  # ─────────────────────────────────────────────────────────────────────────
  lint:
    name: ESLint — lint check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 3 — Next.js build
  # ─────────────────────────────────────────────────────────────────────────
  build-next:
    name: Next.js — build
    runs-on: ubuntu-latest
    needs: [typecheck, lint]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 4 — Rust: fmt + clippy + test
  # ─────────────────────────────────────────────────────────────────────────
  contracts-check:
    name: Contracts — fmt + clippy + unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          # soroban-sdk 25 requires Rust 1.78+. Pin to a known-good version.
          toolchain: 1.82.0
          components: rustfmt, clippy
          targets: wasm32v1-none

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run unit tests
        run: cargo test --all

  # ─────────────────────────────────────────────────────────────────────────
  # JOB 5 — Compile Soroban contracts to WASM
  # ─────────────────────────────────────────────────────────────────────────
  contracts-compile:
    name: Contracts — compile to WASM
    runs-on: ubuntu-latest
    needs: [contracts-check]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.82.0
          targets: wasm32v1-none

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install Stellar CLI
        run: |
          cargo install --locked stellar-cli --features opt

      - name: Compile contracts
        run: stellar contract build

      - name: Verify WASM artifacts exist
        run: |
          echo "Checking compiled WASM files..."
          ls -lh target/wasm32v1-none/release/*.wasm
          for wasm in target/wasm32v1-none/release/*.wasm; do
            echo "✓ $(basename $wasm) — $(wc -c < $wasm) bytes"
          done

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wasm-contracts-${{ github.sha }}
          path: target/wasm32v1-none/release/*.wasm
          retention-days: 30
